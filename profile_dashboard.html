<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GameGPT — Dashboard</title>
<style>
  :root {
    --teal: #1D9E75;
    --orange: #C9702E;
    --ink: #12151B;
    --nav-bg: #0D0F14;
    --card: #171B22;
    --border: #232A34;
    --border-row: #1F2530;
    --text: #ECEEF2;
    --text-muted: #9AA3AF;
    --text-faint: #8890A0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--ink); color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }

  nav {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 28px;
    background: var(--nav-bg); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  .nav-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: none; color: inherit; padding: 0; font: inherit; }
  .nav-mark-bar { width: 20px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--teal), var(--orange)); }
  .nav-brand-text { font-size: 17px; font-weight: 700; }
  .nav-links { display: flex; gap: 4px; }
  .nav-link { background: transparent; border: none; color: var(--text-muted); padding: 8px 12px; font-size: 14px; cursor: pointer; border-radius: 6px; font-family: inherit; }
  .nav-link.active { background: #1B2029; color: var(--text); }

  main { flex: 1; padding: 0 28px; }
  .page { max-width: 760px; margin: 0 auto; padding: 48px 0 64px; }
  .page-bar { width: 56px; height: 4px; border-radius: 2px; margin-bottom: 18px; background: linear-gradient(90deg, var(--teal), var(--orange)); }
  .eyebrow { color: var(--text-faint); font-size: 13px; margin: 0 0 8px; }
  .title { font-size: 30px; font-weight: 700; margin: 0 0 12px; line-height: 1.25; display: flex; align-items: center; gap: 10px; }
  .blurb { color: #B3B9C4; font-size: 15px; line-height: 1.6; max-width: 560px; margin: 0 0 28px; }

  .edit-name-btn { background: none; border: none; color: var(--text-faint); font-size: 14px; cursor: pointer; }
  .name-input { font-size: 22px; font-weight: 700; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 4px 8px; font-family: inherit; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
  .stat-value { font-size: 30px; font-weight: 700; margin: 0 0 4px; }
  .stat-value-muted { font-size: 18px; font-weight: 500; color: var(--text-faint); }
  .stat-label { color: var(--text-faint); font-size: 13px; margin: 0; }

  .empty-card { background: var(--card); border: 1px dashed #2A303B; border-radius: 12px; padding: 28px 24px; max-width: 480px; }
  .empty-title { font-size: 17px; font-weight: 700; margin: 0 0 8px; }
  .empty-body { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin: 0 0 18px; }

  .section-label { font-size: 13px; color: var(--text-faint); font-weight: 600; margin: 36px 0 12px; }
  .action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .action-card { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; cursor: pointer; font: inherit; color: inherit; }
  .action-title { font-size: 15px; font-weight: 700; margin: 0 0 6px; }
  .action-body { color: var(--text-muted); font-size: 13px; line-height: 1.5; margin: 0; }

  .btn-primary, .btn-primary-sm { background: var(--teal); color: #08120E; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-primary-sm { border-radius: 6px; padding: 7px 14px; font-size: 13px; }
  .btn-ghost, .btn-ghost-sm { background: transparent; color: var(--text); border: 1px solid #2A303B; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .btn-ghost-sm { border-radius: 6px; padding: 7px 14px; font-size: 13px; }

  .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); max-width: 560px; }
  .settings-label { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .muted { color: var(--text-faint); font-size: 13px; }
  .tag { color: var(--teal); font-size: 12px; background: rgba(29,158,117,0.14); padding: 2px 8px; border-radius: 999px; display: inline-block; }

  input[type="text"] { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #2A303B; border-radius: 8px; background: var(--card); color: var(--text); font-family: inherit; }
  ul.list { list-style: none; margin: 20px 0 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--card); }
  ul.list li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-row); font-size: 14px; }
  ul.list li:last-child { border-bottom: none; }
  .empty-note { color: var(--text-faint); font-size: 14px; margin-top: 20px; }
</style>
</head>
<body>

  <nav id="nav"></nav>
  <main id="main"></main>

  <script>
  /**
   * GameGPT dashboard — fully functional, no demo/fake state.
   * State loads from/saves to localStorage and only changes via real
   * user actions (link/unlink a platform, edit name, search). The empty
   * state is reached by actually disconnecting every platform.
   */

  const STORAGE_KEY = "gamegpt_dashboard_state";

  // Mock owned-games per platform; stands in for a real library sync API.
  const PLATFORM_CATALOGS = {
    steam: { name: "Steam", games: ["Baldur's Gate 3", "Half-Life: Alyx", "Portal 2", "Hades"] },
    xbox: { name: "Xbox", games: ["Forza Horizon 5", "Halo Infinite"] },
    epic: { name: "Epic Games", games: ["Fortnite", "Rocket League", "Slay the Spire"] },
    psn: { name: "PlayStation", games: ["God of War Ragnarök", "Spider-Man 2", "Returnal"] },
  };

  // Searchable catalog (title + tags) used for real substring matching.
  const SEARCH_CATALOG = [
    { title: "Outer Wilds", tags: "exploration space puzzle mystery" },
    { title: "Hollow Knight: Silksong", tags: "platformer metroidvania combat" },
    { title: "Tunic", tags: "exploration puzzle isometric zelda-like" },
    { title: "Death's Door", tags: "action adventure zelda-like" },
    { title: "Stardew Valley", tags: "farming cozy relaxing" },
    { title: "Disco Elysium", tags: "narrative rpg mystery" },
    { title: "Hades", tags: "roguelike action combat" },
    { title: "Celeste", tags: "platformer precision story" },
  ];

  function defaultState() {
    return {
      displayName: "Player",
      platforms: { steam: false, xbox: false, epic: false, psn: false },
      history: [],
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      // Merge with defaults in case new fields get added later.
      return { ...defaultState(), ...parsed, platforms: { ...defaultState().platforms, ...parsed.platforms } };
    } catch (err) {
      console.error("Failed to load saved state, starting fresh:", err);
      return defaultState();
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (err) {
      console.error("Failed to save state:", err);
    }
  }

  function logHistory(what) {
    state.history.unshift({ what, when: new Date().toISOString() });
    state.history = state.history.slice(0, 20); // keep it bounded
  }

  let state = loadState();

  // Library size is derived live from connected platforms, not stored.
  function getOwnedGames() {
    const games = [];
    Object.entries(state.platforms).forEach(([id, connected]) => {
      if (connected) {
        PLATFORM_CATALOGS[id].games.forEach((title) => games.push({ title, platform: PLATFORM_CATALOGS[id].name }));
      }
    });
    return games;
  }

  function getLinkedCount() {
    return Object.values(state.platforms).filter(Boolean).length;
  }

  // ---------------------------------------------------------------------
  // Routing
  // ---------------------------------------------------------------------
  const ROUTES = [
    { path: "dashboard", label: "Dashboard" },
    { path: "settings", label: "Settings" },
    { path: "search", label: "Search" },
    { path: "history", label: "History" },
  ];

  function parseHash() {
    const raw = window.location.hash.replace(/^#\/?/, "").split("?")[0];
    return raw || "dashboard";
  }
  function navigate(path) {
    window.location.hash = "#/" + path;
  }
  window.addEventListener("hashchange", render);

  function renderNav() {
    const route = parseHash();
    const links = ROUTES.map(
      (r) => `<button class="nav-link ${r.path === route ? "active" : ""}" data-nav="${r.path}">${r.label}</button>`
    ).join("");
    const nav = document.getElementById("nav");
    nav.innerHTML = `
      <button class="nav-brand" data-nav="dashboard">
        <span class="nav-mark-bar"></span><span class="nav-brand-text">GameGPT</span>
      </button>
      <div class="nav-links">${links}</div>
    `;
    nav.querySelectorAll("[data-nav]").forEach((el) => el.addEventListener("click", () => navigate(el.dataset.nav)));
  }

  function pageShell(eyebrow, titleHtml, blurb, bodyHtml) {
    return `
      <div class="page">
        <div class="page-bar"></div>
        ${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ""}
        <h1 class="title">${titleHtml}</h1>
        ${blurb ? `<p class="blurb">${blurb}</p>` : ""}
        ${bodyHtml || ""}
      </div>`;
  }

  // ---------------------------------------------------------------------
  // Dashboard — real stats, real empty state, real entry points.
  // ---------------------------------------------------------------------
  function Dashboard() {
    const linkedCount = getLinkedCount();
    const totalCount = Object.keys(PLATFORM_CATALOGS).length;
    const library = getOwnedGames();
    const isEmpty = linkedCount === 0;

    const statsOrEmptyHtml = isEmpty
      ? `
        <div class="empty-card">
          <p class="empty-title">No platforms linked yet</p>
          <p class="empty-body">
            Connect a platform in Settings and GameGPT will pull in your library automatically.
          </p>
          <button class="btn-primary" data-nav="settings">Link a platform</button>
        </div>`
      : `
        <div class="stat-grid">
          <div class="stat-card">
            <p class="stat-value">${linkedCount}<span class="stat-value-muted">/${totalCount}</span></p>
            <p class="stat-label">Platforms linked</p>
          </div>
          <div class="stat-card">
            <p class="stat-value">${library.length}</p>
            <p class="stat-label">Games in library</p>
          </div>
        </div>`;

    const titleHtml = `
      <span id="name-display">Welcome back, ${state.displayName}</span>
      <button class="edit-name-btn" id="edit-name-btn" title="Edit name">✎</button>
    `;

    const html = pageShell(
      "Home",
      titleHtml,
      isEmpty
        ? "Link a platform to start building your library and get personalized recommendations."
        : "Here's where things stand across your linked platforms.",
      `
      ${statsOrEmptyHtml}
      <p class="section-label">Next steps</p>
      <div class="action-grid">
        <button class="action-card" data-nav="settings">
          <p class="action-title">Link a platform</p>
          <p class="action-body">Connect another storefront to widen your library.</p>
        </button>
        <button class="action-card" data-nav="search">
          <p class="action-title">Search for a game</p>
          <p class="action-body">Describe what you're in the mood for, no filters needed.</p>
        </button>
        <button class="action-card" data-nav="history">
          <p class="action-title">View history</p>
          <p class="action-body">Revisit past actions and searches.</p>
        </button>
      </div>`
    );

    function attach(root) {
      root.querySelectorAll("[data-nav]").forEach((el) => el.addEventListener("click", () => navigate(el.dataset.nav)));

      // Inline "edit name": click pencil, type, Enter/blur to save.
      document.getElementById("edit-name-btn").addEventListener("click", () => {
        const display = document.getElementById("name-display");
        display.outerHTML = `<input id="name-input" class="name-input" type="text" value="${state.displayName}" />`;
        const input = document.getElementById("name-input");
        input.focus();
        input.select();
        const commit = () => {
          const newName = input.value.trim() || "Player";
          if (newName !== state.displayName) {
            state.displayName = newName;
            logHistory(`Changed display name to "${newName}"`);
            saveState();
          }
          render();
        };
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") commit(); });
        input.addEventListener("blur", commit);
      });
    }

    return { html, attach };
  }

  // ---------------------------------------------------------------------
  // Settings — the only place platform state actually changes.
  // ---------------------------------------------------------------------
  function Settings() {
    const rows = Object.entries(PLATFORM_CATALOGS)
      .map(([id, meta]) => {
        const connected = state.platforms[id];
        return `
        <div class="settings-row">
          <div>
            <p class="settings-label">${meta.name}</p>
            <p class="muted">${connected ? `Connected · ${meta.games.length} games` : "Not connected"}</p>
          </div>
          <button class="btn-ghost-sm" data-toggle="${id}">${connected ? "Disconnect" : "Connect"}</button>
        </div>`;
      })
      .join("");

    const html = pageShell(
      "Account",
      "Settings",
      "Connecting or disconnecting a platform here immediately updates your dashboard and library.",
      `<p class="section-label" style="margin-top:0;">Linked platforms</p>${rows}`
    );

    function attach(root) {
      root.querySelectorAll("[data-toggle]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.toggle;
          const wasConnected = state.platforms[id];
          state.platforms[id] = !wasConnected;
          logHistory(`${wasConnected ? "Disconnected" : "Connected"} ${PLATFORM_CATALOGS[id].name}`);
          saveState();
          render();
        });
      });
    }
    return { html, attach };
  }

  // ---------------------------------------------------------------------
  // Search — real substring matching; flags results already in the library.
  // ---------------------------------------------------------------------
  function Search() {
    const html = pageShell(
      "Find something to play",
      "Search",
      "Type a genre, mood, or keyword.",
      `
      <form id="search-form" style="display:flex; gap:8px; max-width:480px;">
        <input id="search-input" type="text" placeholder="cozy, roguelike, zelda-like…" />
        <button type="submit" class="btn-primary">Search</button>
      </form>
      <div id="search-results"></div>
      `
    );

    function attach(root) {
      const owned = new Set(getOwnedGames().map((g) => g.title));
      const resultsEl = document.getElementById("search-results");

      function runSearch(query) {
        const q = query.trim().toLowerCase();
        if (!q) {
          resultsEl.innerHTML = `<p class="empty-note">Try: "cozy", "roguelike", or "zelda-like"</p>`;
          return;
        }
        const matches = SEARCH_CATALOG.filter(
          (g) => g.title.toLowerCase().includes(q) || g.tags.includes(q)
        );
        logHistory(`Searched "${query.trim()}" (${matches.length} result${matches.length === 1 ? "" : "s"})`);
        saveState();

        if (matches.length === 0) {
          resultsEl.innerHTML = `<p class="empty-note">No matches for "${query}". Try a different word.</p>`;
          return;
        }
        resultsEl.innerHTML = `
          <ul class="list" style="margin-top:20px;">
            ${matches
              .map(
                (g) => `
              <li>
                <span>${g.title}</span>
                <span>${owned.has(g.title) ? `<span class="tag">Already owned</span>` : `<span class="muted">Not owned</span>`}</span>
              </li>`
              )
              .join("")}
          </ul>`;
      }

      document.getElementById("search-form").addEventListener("submit", (e) => {
        e.preventDefault();
        runSearch(document.getElementById("search-input").value);
      });
      runSearch(""); // show the initial hint
    }
    return { html, attach };
  }

  // ---------------------------------------------------------------------
  // History — real log of actions taken, not hard-coded rows.
  // ---------------------------------------------------------------------
  function History() {
    const rows = state.history.length
      ? state.history
          .map(
            (ev) => `<li><span>${ev.what}</span><span class="muted">${new Date(ev.when).toLocaleString()}</span></li>`
          )
          .join("")
      : "";

    const html = pageShell(
      "Activity",
      "History",
      "A log of what's happened in your account so far.",
      state.history.length
        ? `<ul class="list">${rows}</ul>`
        : `<p class="empty-note">Nothing yet — link a platform or run a search to see activity here.</p>`
    );
    return { html, attach: () => {} };
  }

  const PAGES = { dashboard: Dashboard, settings: Settings, search: Search, history: History };

  function render() {
    renderNav();
    const route = parseHash();
    const pageFn = PAGES[route] || Dashboard;
    const { html, attach } = pageFn();
    const root = document.getElementById("main");
    root.innerHTML = html;
    attach(root);
  }

  render(); // initial paint
  </script>
</body>
</html>
